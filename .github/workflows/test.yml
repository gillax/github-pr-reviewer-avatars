name: test

# Run the unit tests on every push to main and on every pull request.
# The result of this workflow is wired into the branch-protection ruleset as a
# required status check, so a PR cannot be merged unless these tests pass.

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the test job only needs to read the checked-out code.
permissions:
  contents: read

jobs:
  # The job id doubles as the status check context that the branch-protection
  # ruleset requires ("test"), so do not add a `name:` here — it would rename
  # the context and leave the required check waiting forever.
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit SHA (not a moving tag) so a compromised
      # or retagged release cannot silently run in this repository's CI.
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # No dependencies to install — the suite uses only Node's built-in
      # test runner (node:test) and asserts against the pure src/lib modules.
      - name: Run unit tests
        run: node --test
